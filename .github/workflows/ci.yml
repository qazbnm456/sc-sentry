name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    # ruff is bounded to the same minor version as pyproject's dev extra, because its formatter's output changes between minors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.16.7,<0.17"
      - run: ruff check src tests
      - run: ruff format --check src tests

  test:
    # The harness as a user installs it, with no benchmark. This also proves that it needs none: the core tests run, and the contract-assay adapter's tests skip themselves because the extra is absent.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: mypy src --exclude 'sc_sentry/contract_assay'
      - run: pytest

  adapter:
    # The contract-assay adapter (`sc_sentry.contract_assay`), with the extra installed from PyPI. Its tests build their own corpus, so this job needs no clone of contract-assay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,contract-assay]"
      - run: mypy src
      - run: pytest
