name: Release

# Publishes when a GitHub Release is published, as contract-assay does. A tag
# push alone publishes nothing. The Release is where a version's notes are
# written, and publishing it is the one deliberate act that ships. The `pypi`
# environment then waits for a maintainer's approval and accepts only `v*`
# refs, so the upload, which can never be undone, takes two decisions and not
# one. A PyPI version can never be uploaded again, even after it is deleted, so
# everything that can fail runs before the upload.
#
# `workflow_dispatch` builds and gates from any ref and publishes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # The interpreters `ci.yml` tests. A release tested on fewer is a
        # weaker claim than the commits in it made.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: The tag, pyproject and __version__ name one version
        id: version
        env:
          # Through the environment, never interpolated into the script: a
          # Release's tag name is text somebody typed.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          project=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sc_sentry/__init__.py)
          echo "tag=${TAG:-none} pyproject=${project} __version__=${module}"
          test "${project}" = "${module}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ] && [ "${TAG}" != "v${project}" ]; then
            echo "::error::release tag '${TAG}' does not match the version '${project}' (expected 'v${project}'). A PyPI version can never be reused; fix the tag or the version before publishing."
            exit 1
          fi
          echo "version=${project}" >> "$GITHUB_OUTPUT"

      - name: Build the wheel and the sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the built wheel, not the source tree
        # `pip install -e .` proves the repository works, not the wheel; they
        # differ exactly where a release goes wrong, such as a skill or a
        # manifest the package data missed. The dev tools come with it, at the
        # bounds pyproject gives them.
        run: python -m pip install "$(ls dist/*.whl)[dev,contract-assay]"

      - name: The gate, against the installed wheel
        run: |
          set -euo pipefail
          ruff check src tests
          ruff format --check src tests
          mypy src
          python -c 'import sc_sentry, sys; p = sc_sentry.__file__; print(p); sys.exit("/src/" in p)'
          python -m pytest -q

      - name: The documented commands, from the wheel and away from the checkout
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          cat > Vault.sol <<'SOL'
          pragma solidity ^0.8.0;
          contract Vault {
              mapping(address => uint256) public balances;
              function withdraw() external {
                  uint256 amount = balances[msg.sender];
                  (bool ok, ) = msg.sender.call{value: amount}("");
                  require(ok);
                  balances[msg.sender] = 0;
              }
          }
          SOL
          sc-sentry classes
          sc-sentry audit Vault.sol --mode static --class reentrancy --format sarif --out vault.sarif
          python - <<'PY'
          import json, os
          run = json.load(open("vault.sarif"))["runs"][0]
          assert run["tool"]["driver"]["version"] == os.environ["VERSION"], run["tool"]["driver"]["version"]
          assert run["results"], "the static audit found nothing in a textbook reentrancy"
          print(f"{os.environ['VERSION']}: {len(run['results'])} result(s)")
          PY
          sc-sentry-contract-assay --help

      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.11'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # A published Release in this repository only. `release: published` also
    # fires in a fork that cuts a release of its own, and the trusted-publisher
    # binding would refuse it, but a refused attempt is still a red run there.
    if: github.event_name == 'release' && github.repository == 'qazbnm456/sc-sentry'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sc-sentry/
    # Trusted Publishing: no token is stored in this repository.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Pinned by commit, with the version beside it, because this is the step
      # that uploads. Bump the SHA and the comment together.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  verify:
    # Does what was just published install from PyPI and run? Informational: a
    # PyPI version cannot be withdrawn, so a red here means the next patch
    # release, not a rollback.
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the published version, waiting for the index to serve it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -uo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          for attempt in $(seq 1 8); do
            # `--no-cache-dir`, or a retry is answered from the page the
            # too-early attempt cached.
            if "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir "sc-sentry==$VERSION"; then
              "$RUNNER_TEMP/venv/bin/sc-sentry" classes
              exit 0
            fi
            echo "sc-sentry==$VERSION is not installable yet (attempt $attempt/8)"
            sleep 20
          done
          echo "::error::sc-sentry==$VERSION did not become installable after 8 attempts. The upload already happened and cannot be undone; fix forward with the next patch release."
          exit 1
